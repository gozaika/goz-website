<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- goZaika Partner Dashboard — proposed UX mockup. Illustrative placeholders only; no real product data. -->
  <defs>
    <linearGradient id="forestHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A5C38"/>
      <stop offset="1" stop-color="#14492C"/>
    </linearGradient>
    <filter id="pcard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2D2D2D" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#FFF8F0"/>

  <!-- status bar -->
  <text x="20" y="28" font-size="12" font-weight="700" fill="#2D2D2D">9:41</text>
  <text x="345" y="28" font-size="12" fill="#6B7280">▢ ▦ ▰</text>

  <!-- header -->
  <rect x="20" y="56" width="6" height="22" rx="3" fill="#1A5C38"/>
  <text x="34" y="74" font-size="19" font-weight="800" fill="#2D2D2D">goZaika Partner</text>
  <rect x="250" y="54" width="88" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="262" y="72" font-size="11" font-weight="600" fill="#1A5C38">Restaurant ▾</text>
  <rect x="346" y="56" width="30" height="24" rx="12" fill="#E7F4EC"/>
  <text x="361" y="72" font-size="10" font-weight="800" fill="#1A5C38" text-anchor="middle">● </text>

  <!-- TODAY hero -->
  <g filter="url(#pcard)">
    <rect x="16" y="92" width="358" height="120" rx="18" fill="url(#forestHero)"/>
  </g>
  <text x="32" y="120" font-size="12" font-weight="700" fill="#9FD8B6">TODAY · Restaurant name</text>
  <text x="32" y="160" font-size="34" font-weight="800" fill="#FFFFFF">₹X,XXX</text>
  <text x="32" y="182" font-size="12" fill="#D9E8DF">Revenue from visible sold qty</text>
  <rect x="250" y="108" width="108" height="26" rx="13" fill="#D4A017"/>
  <text x="304" y="125" font-size="11" font-weight="800" fill="#2D2D2D" text-anchor="middle">ACTIVE</text>
  <rect x="250" y="142" width="108" height="56" rx="12" fill="#FFFFFF" opacity="0.12"/>
  <text x="304" y="166" font-size="11" fill="#D9E8DF" text-anchor="middle">Sell-through</text>
  <text x="304" y="188" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">XX.X%</text>

  <!-- action cards -->
  <text x="20" y="242" font-size="15" font-weight="800" fill="#2D2D2D">Needs your attention</text>
  <g filter="url(#pcard)">
    <rect x="16" y="252" width="174" height="86" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="16" y="252" width="6" height="86" rx="3" fill="#FF6B35"/>
  <text x="34" y="280" font-size="26" font-weight="800" fill="#2D2D2D">N</text>
  <text x="34" y="300" font-size="12" font-weight="700" fill="#2D2D2D">Pickup-ready</text>
  <text x="34" y="318" font-size="11" fill="#6B7280">Awaiting collection</text>
  <rect x="34" y="324" width="86" height="6" rx="3" fill="#FCEBEA"/>

  <g filter="url(#pcard)">
    <rect x="200" y="252" width="174" height="86" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="200" y="252" width="6" height="86" rx="3" fill="#1A5C38"/>
  <text x="218" y="280" font-size="20" font-weight="800" fill="#2D2D2D">Next drop</text>
  <text x="218" y="300" font-size="12" fill="#6B7280">in — h — m</text>
  <text x="218" y="320" font-size="11" font-weight="700" fill="#1A5C38">Drop title placeholder</text>

  <!-- metric row -->
  <g filter="url(#pcard)"><rect x="16" y="352" width="113" height="78" rx="14" fill="#FFFFFF"/></g>
  <text x="30" y="376" font-size="10" fill="#6B7280">Bags sold/listed</text>
  <text x="30" y="402" font-size="20" font-weight="800" fill="#2D2D2D">XX/XX</text>
  <g filter="url(#pcard)"><rect x="139" y="352" width="113" height="78" rx="14" fill="#FFFFFF"/></g>
  <text x="153" y="376" font-size="10" fill="#6B7280">Collected today</text>
  <text x="153" y="402" font-size="20" font-weight="800" fill="#2D2D2D">XX</text>
  <g filter="url(#pcard)"><rect x="262" y="352" width="112" height="78" rx="14" fill="#FFFFFF"/></g>
  <text x="276" y="376" font-size="10" fill="#6B7280">AOV</text>
  <text x="276" y="402" font-size="20" font-weight="800" fill="#2D2D2D">₹XXX</text>

  <!-- next drop card -->
  <g filter="url(#pcard)"><rect x="16" y="444" width="358" height="96" rx="16" fill="#FFF8F0" stroke="#FFE3CF"/></g>
  <text x="32" y="470" font-size="13" font-weight="800" fill="#2D2D2D">Next drop</text>
  <text x="32" y="492" font-size="13" fill="#2D2D2D">Drop title placeholder</text>
  <text x="32" y="512" font-size="11" fill="#6B7280">Pickup window · date placeholder</text>
  <rect x="32" y="518" width="150" height="14" rx="7" fill="#E5E7EB"/>
  <rect x="32" y="518" width="92" height="14" rx="7" fill="#1A5C38"/>
  <text x="200" y="529" font-size="11" font-weight="700" fill="#1A5C38">XX/XX bags available</text>

  <!-- quick actions -->
  <rect x="16" y="556" width="174" height="48" rx="12" fill="#1A5C38"/>
  <text x="103" y="585" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pickup counter</text>
  <rect x="200" y="556" width="174" height="48" rx="12" fill="#FFFFFF" stroke="#1A5C38" stroke-width="1.5"/>
  <text x="287" y="585" font-size="14" font-weight="800" fill="#1A5C38" text-anchor="middle">New drop</text>

  <!-- role note -->
  <rect x="16" y="620" width="358" height="40" rx="12" fill="#EAF1FB"/>
  <text x="32" y="638" font-size="11" font-weight="700" fill="#1C4E8A">Role-aware view</text>
  <text x="32" y="653" font-size="10" fill="#1C4E8A">Financials hidden for PICKUP_STAFF · ops queue hidden for FINANCE</text>

  <!-- illustrative caption -->
  <text x="195" y="690" font-size="10" fill="#9CA3AF" text-anchor="middle" font-style="italic">Illustrative placeholder content — not real product data</text>

  <!-- tab bar -->
  <rect x="0" y="784" width="390" height="60" fill="#FFFFFF"/>
  <rect x="0" y="784" width="390" height="1" fill="#E5E7EB"/>
  <text x="48" y="812" font-size="16" fill="#1A5C38" text-anchor="middle">▦</text>
  <text x="48" y="828" font-size="10" font-weight="700" fill="#1A5C38" text-anchor="middle">Home</text>
  <text x="146" y="812" font-size="16" fill="#6B7280" text-anchor="middle">▤</text>
  <text x="146" y="828" font-size="10" fill="#6B7280" text-anchor="middle">Orders</text>
  <text x="244" y="812" font-size="16" fill="#6B7280" text-anchor="middle">▢</text>
  <text x="244" y="828" font-size="10" fill="#6B7280" text-anchor="middle">Drops</text>
  <text x="342" y="812" font-size="16" fill="#6B7280" text-anchor="middle">⋯</text>
  <text x="342" y="828" font-size="10" fill="#6B7280" text-anchor="middle">More</text>
</svg>
